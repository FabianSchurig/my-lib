name: Yocto Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  yocto-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    - name: Create Yocto build Dockerfile
      run: |
        cat > Dockerfile.yocto <<'EOF'
        FROM crops/poky:ubuntu-22.04
        
        USER root
        RUN apt-get update && apt-get install -y \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect \
            xz-utils debianutils iputils-ping python3-git python3-jinja2 \
            libegl1-mesa libsdl1.2-dev python3-subunit mesa-common-dev \
            zstd liblz4-tool file locales && \
            rm -rf /var/lib/apt/lists/*
        
        RUN locale-gen en_US.UTF-8
        ENV LANG en_US.UTF-8
        
        WORKDIR /workdir
        USER pokyuser
        
        # Clone Poky
        RUN git clone -b kirkstone git://git.yoctoproject.org/poky.git && \
            cd poky && \
            git clone -b kirkstone git://git.openembedded.org/meta-openembedded
        
        # Copy recipe
        COPY --chown=pokyuser:pokyuser yocto/mylib_1.0.0.bb poky/meta/recipes-support/mylib/
        
        # Build
        RUN cd poky && \
            . oe-init-build-env && \
            bitbake-layers add-layer ../meta-openembedded/meta-oe && \
            echo 'INHERIT += "rm_work"' >> conf/local.conf && \
            bitbake mylib || true
        
        # Export artifacts
        RUN mkdir -p /workdir/artifacts && \
            find poky/build/tmp/deploy -name "*.so*" -o -name "*.ipk" -o -name "*.deb" | \
            xargs -I {} cp {} /workdir/artifacts/ || true
        
        CMD ["ls", "-lah", "/workdir/artifacts"]
        EOF
    
    - name: Build Yocto image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.yocto
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Extract artifacts from image
      run: |
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        docker create --name temp ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        docker cp temp:/workdir/artifacts ./yocto-artifacts || mkdir -p yocto-artifacts
        docker rm temp
        ls -lah yocto-artifacts/
    
    - name: Upload Yocto artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mylib-yocto-kirkstone
        path: yocto-artifacts/*
        if-no-files-found: warn
